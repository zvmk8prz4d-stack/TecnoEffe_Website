<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina non trovata — Tecnoeffe</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#052f21" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500&amp;family=Jost:wght@300;400;500&amp;display=swap"
    />
    <!-- Questa pagina viene servita da qualunque indirizzo inesistente, anche
         profondo (/a/b/c): nessun percorso relativo funzionerebbe. Per questo
         non richiama styles.css ne' script.js ne' immagini, ha il foglio di
         stile qui dentro, e l'unico collegamento e' scritto per intero. -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        color: #fbfaf5;
        background: #052f21;
        font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 300;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(560px, 100%); text-align: center; }
      .eyebrow {
        margin: 0 0 18px;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: .34em;
        text-transform: uppercase;
        color: rgba(251, 250, 245, .72);
      }
      h1 {
        margin: 0 0 20px;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 500;
        font-size: clamp(38px, 8vw, 62px);
        line-height: .98;
        letter-spacing: -.025em;
      }
      h1 em { font-weight: 400; }
      p { margin: 0 0 34px; color: rgba(251, 250, 245, .86); }
      a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 30px;
        border: 1px solid rgba(255, 255, 255, .88);
        border-radius: 2px;
        color: #fbfaf5;
        font-size: 13px;
        letter-spacing: .16em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background .4s cubic-bezier(.22,.72,.18,1), color .4s cubic-bezier(.22,.72,.18,1);
      }
      a:hover, a:focus-visible { color: #052f21; background: #fbfaf5; }
      .tel {
        margin: 30px 0 0;
        font-size: 14px;
        letter-spacing: .04em;
        color: rgba(251, 250, 245, .72);
      }
      .tel a {
        display: inline;
        padding: 0;
        border: 0;
        font-size: inherit;
        letter-spacing: inherit;
        text-transform: none;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .tel a:hover, .tel a:focus-visible { color: #fbfaf5; background: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Errore 404</p>
      <h1>Questa pagina<br /><em>non c’è.</em></h1>
      <p>
        L’indirizzo è sbagliato oppure la pagina è stata spostata. Dalla home
        trovi serramenti, porte, portoncini e il modulo per il preventivo.
      </p>
      <a href="https://zvmk8prz4d-stack.github.io/TecnoEffe_Website/"
        >Torna alla home</a
      >
      <p class="tel">
        Oppure chiamaci: <a href="tel:+393487150612">+39 348 715 0612</a>
      </p>
    </main>
  </body>
</html>
